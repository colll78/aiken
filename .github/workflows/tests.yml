name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cache-version:
        type: number
        default: 2

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-build-v${{ inputs.cache-version }}
      - name: Build release
        run: |
          sudo apt-get install -y pkg-config libssl-dev musl musl-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo install --path=crates/aiken --target=x86_64-unknown-linux-musl
          mv $(which aiken) aiken
          ldd aiken
      - uses: actions/upload-artifact@v5
        with:
          name: aiken-${{ github.sha }}-${{ runner.arch }}-${{ runner.os }}
          path: ./aiken

  acceptance_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-build-v${{ inputs.cache-version }}
      - name: Run examples
        run: |
          cargo run -r -- check examples/hello_world
          cargo run -r -- check examples/gift_card
          cargo run -r -- check examples/monorepo
      - name: Run acceptance tests
        working-directory: examples/acceptance_tests
        run: |
          cargo install cbor-diag-cli
          bash ci
        shell: bash

  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-tests-v${{ inputs.cache-version }}
      - name: Run unit tests
        run: cargo test --verbose --workspace

  wasm_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-wasm-v${{ inputs.cache-version }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # The evaluator is also shipped as wasm, where usize is 32 bits and
      # secp256k1 goes through k256 instead of libsecp256k1, so run its unit
      # and conformance tests on a wasm32 target as well.
      - name: Run uplc tests on wasm32
        env:
          CC_wasm32_wasip1: clang
          AR_wasm32_wasip1: llvm-ar
          CARGO_TARGET_WASM32_WASIP1_RUNNER: >-
            wasmtime --dir=.
            --dir=${{ github.workspace }}::${{ github.workspace }}
            --env INSTA_WORKSPACE_ROOT=${{ github.workspace }}
        run: |
          sudo apt-get install -y clang llvm
          rustup target add wasm32-wasip1
          cargo test --verbose --package uplc --target wasm32-wasip1

  benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-build-v${{ inputs.cache-version }}
      - name: Run benchmarks
        run: |
          cargo run -r -- check benchmarks

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-cache-unit-v${{ inputs.cache-version }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
